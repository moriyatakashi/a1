<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../common/config.js?v=202608161200"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m3 / メモ</title>
<link rel="stylesheet" href="../common/base.css?v=202607141905">
<style>
  /* new-entry-card一式(src/common/ledger.cssからの移植、2026-08-16)。
     --paper-bandはbase.cssに無いため--input-bgで代用(m1のbe統合分と同じ扱い)。 */
  .new-entry-card {
    border: 1px solid var(--line); border-top: 3px solid var(--accent);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; background: var(--paper);
  }
  .new-entry-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
  .new-entry-sub { font-size: 0.7rem; color: var(--ink-soft); margin-bottom: 8px; }
  .lane-form-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.65rem;
    color: var(--ink-soft); display: block; margin: 8px 0 4px;
  }
  .field-input, .field-textarea {
    width: 100%; font-size: 0.85rem; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 5px; background: var(--input-bg); color: var(--ink); font-family: inherit; box-sizing: border-box;
  }
  .field-textarea { resize: vertical; min-height: 46px; }
  .json-paste { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.74rem; min-height: 54px; }
  .new-entry-divider {
    display: flex; align-items: center; gap: 10px; font-size: 0.66rem; color: var(--ink-soft); margin: 14px 0 8px;
  }
  .new-entry-divider::before, .new-entry-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .new-entry-submit {
    margin-top: 10px; font-size: 0.8rem; padding: 8px 16px; border: 1px solid var(--accent);
    border-radius: 6px; background: transparent; color: var(--accent); font-weight: 600; cursor: pointer;
  }
  .cls-radio { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .cls-radio label {
    font-size: 0.75rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink-soft); cursor: pointer;
  }
  .cls-radio input { display: none; }
  .cls-radio label:has(input:checked) { color: var(--ink); border-color: var(--ink-soft); background: var(--input-bg); }
  .post-result { font-size: 0.78rem; color: var(--ink-soft); margin-top: 8px; min-height: 1.2em; }
  /* af の開いているもの(2026-10-10、ab-161) */
  .af-head { font-weight: 700; font-size: 0.9rem; margin: 4px 0 8px; }
  .af-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--paper); }
  .af-meta { font-size: 0.68rem; color: var(--ink-soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .af-title { font-weight: 600; font-size: 0.88rem; margin: 2px 0; }
  .af-body { font-size: 0.8rem; white-space: pre-wrap; color: var(--ink); margin-top: 4px; }
  .af-tags { font-size: 0.7rem; color: var(--ink-soft); margin-top: 4px; }
  .af-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .af-btn { font-size: 0.74rem; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
  .af-msg { font-size: 0.72rem; color: var(--ink-soft); }
  .af-empty, #afList { font-size: 0.8rem; color: var(--ink-soft); }
</style>
</head>
<body>
  <p><a href="../../">← 戻る</a></p>
  <h1>路歴（m3） / メモ</h1>
  <p class="lede" style="font-size:0.8rem;color:var(--ink-soft);">メモを書く・読む・閉じるページ。2026-10-10 から書き先は af(「ほぼba」、本人だけが読める Firestore)。af の準備が済むまでは今までどおり ba に書きます。</p>
  <p id="lastUpdated" style="font-size:0.8rem;color:var(--ink-soft);">最終更新: —</p>

<!-- LOGIN_GATE:START -->
  <div id="login-gate">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="g_id_onload"
      data-callback="handleCredentialResponse"
      data-auto_prompt="false">
    </div>
    <script>document.getElementById('g_id_onload').setAttribute('data-client_id', window.AA_GOOGLE_CLIENT_ID);</script>
    <div class="g_id_signin"></div>
    <p id="status">未ログイン(ログインすると記入フォームが表示されます)</p>
  </div>
<!-- LOGIN_GATE:END -->

  <div id="content" style="display:none;">
    <div class="new-entry-card">
      <div class="new-entry-title">新規スレッドを追加</div>
      <div class="new-entry-sub">by=takashi に固定。番号(af-N)は自動。</div>

      <label class="lane-form-label">分類(ba-32の規約・いずれか1つ)</label>
      <div class="cls-radio">
        <label><input type="radio" name="newCls" value="案件"><span>案件</span></label>
        <label><input type="radio" name="newCls" value="確定仕様"><span>確定仕様</span></label>
        <label><input type="radio" name="newCls" value="気づき" checked><span>気づき</span></label>
        <label><input type="radio" name="newCls" value="保留論点"><span>保留論点</span></label>
        <label><input type="radio" name="newCls" value="記録"><span>記録</span></label>
      </div>

      <label class="lane-form-label">タイトル</label>
      <input class="field-input" id="newTitle" type="text" placeholder="例: baページのレイアウト崩れ">

      <label class="lane-form-label">タグ(自由・複数可)</label>
      <input class="field-input" id="newTags" type="text" placeholder="#設計 #ba #スマホ">

      <label class="lane-form-label">本文(任意)</label>
      <textarea class="field-textarea" id="newBody" placeholder="経緯やメモ、気づいた状況など"></textarea>

      <div class="new-entry-divider">または、スマホClaudeが作ったJSONを貼り付け</div>
      <textarea class="field-textarea json-paste" id="newJson" placeholder='{"title": "...", "tags": ["...", "..."], "body": "..."}'></textarea>

      <button class="new-entry-submit" type="button" id="btnAddThread">追加する</button>
      <div class="post-result" id="postResult"></div>
    </div>

    <div class="af-head">開いているもの <span id="afCount"></span></div>
    <div id="afList"></div>
  </div>

  <script>window.AA_AUTH_EVENT = "m3-login-success";</script>
  <script src="../common/auth.js?v=202607201000"></script>
  <script type="module" src="app.js?v=202610101900"></script>
  <script type="module">
    import { applyLastUpdated } from "../common/last-updated.js";
    applyLastUpdated("src/m3", "lastUpdated", "最終更新");
  </script>
</body>
</html>
