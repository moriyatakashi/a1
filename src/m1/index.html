<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../common/config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m1</title>
<link rel="stylesheet" href="../common/base.css">
<style>
  .score-display { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .score-num { font-size: 2.2rem; font-weight: 800; min-width: 50px; text-align: center; }
  #slider { flex: 1; }
  .note-input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; background: var(--input-bg); color: var(--ink); }
  .btn-save-score { width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 0.95rem; }
  .score-saved { font-size: 0.78rem; color: var(--ink-soft); margin-top: 6px; text-align: center; min-height: 1.2em; }
  .chart-wrap { margin: 20px 0 4px; }
  #scoreSvg { width: 100%; height: auto; display: block; overflow: visible; }
  .gridline { stroke: var(--line); stroke-width: 1; }
  .baseline { stroke: var(--ink-soft); stroke-width: 1; }
  .axis-label { fill: var(--ink-soft); font-size: 11px; }
  .score-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .score-area { fill: var(--accent); opacity: 0.12; }
  .score-dot { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
  .crosshair { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .hit-area { fill: transparent; }
  .summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 0 0 20px; }
  .stat { background: var(--input-bg); padding: 10px 12px; text-align: center; }
  .stat-num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; font-size: 1.2rem; font-weight: 700; }
  .stat-label { font-size: 0.62rem; color: var(--ink-soft); margin-top: 2px; }
  .score-tooltip { position: absolute; pointer-events: none; background: var(--input-bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 0.78rem; color: var(--ink); opacity: 0; transition: opacity 0.08s ease; white-space: nowrap; }
  .score-tooltip .t-date { color: var(--ink-soft); font-size: 0.68rem; margin-bottom: 2px; }
  .score-tooltip .t-score { font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <p><a href="../../">← 戻る</a></p>
  <h1>m1</h1>
  <div id="login-gate">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="g_id_onload"
      data-callback="handleCredentialResponse"
      data-auto_prompt="false">
    </div>
    <script>document.getElementById('g_id_onload').setAttribute('data-client_id', window.AA_GOOGLE_CLIENT_ID);</script>
    <div class="g_id_signin"></div>
    <p id="status">未ログイン(ログインすると記録一覧が表示されます)</p>
  </div>
  <div id="content" style="display:none;">
    <div class="section">
      <div class="section-title">スコア入力(<span id="scoreDate"></span>)</div>
      <div class="score-display">
        <div class="score-num" id="scoreNum">—</div>
        <input type="range" id="slider" min="0" max="100" value="80">
      </div>
      <input class="note-input" id="noteInput" type="text" placeholder="一言メモ(任意)">
      <button class="btn-save-score" id="btnSaveScore">保存</button>
      <div class="score-saved" id="scoreSaved"></div>
    </div>
    <div id="scoreChartSection" style="display:none;">
      <div class="chart-wrap">
        <svg id="scoreSvg" viewBox="0 0 680 300"></svg>
      </div>
      <div class="summary-bar">
        <div class="stat"><div class="stat-num" id="statLatest">—</div><div class="stat-label">最新</div></div>
        <div class="stat"><div class="stat-num" id="statAvg">—</div><div class="stat-label">平均</div></div>
        <div class="stat"><div class="stat-num" id="statMax">—</div><div class="stat-label">最高</div></div>
        <div class="stat"><div class="stat-num" id="statMin">—</div><div class="stat-label">最低</div></div>
      </div>
    </div>
  </div>
  <div class="score-tooltip" id="scoreTooltip"></div>
  <script>window.AA_AUTH_EVENT = "m1-login-success"; window.AA_PUBLIC_VIEW = true;</script>
  <script src="../common/auth.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
