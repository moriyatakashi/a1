<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>c1 / 準備中</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  /* aa/src/w/s1.htmlの雰囲気(器・配色)だけを踏襲。担当者色やAPI連携など、
     中身が空の今は使わない機能寄りの変数・要素は持ち込んでいない。 */
  :root{
    --bg:#14171a; --card:#1c2024; --ink:#e7ebe9; --sub:#98a0a0; --line:#2c3237;
    --accent:#7ce0c4;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f3f1ea; --card:#fbfaf6; --ink:#23262b; --sub:#6b7160; --line:#dcd8cc; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    padding:18px 14px 60px;line-height:1.55}
  .wrap{max-width:640px;margin:0 auto}
  .back{font-size:12px}
  .back a{color:var(--accent)}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--sub);text-transform:uppercase;margin:14px 0 3px}
  h1{font-size:21px;margin:0 0 3px}
  .lede{color:var(--sub);font-size:12.5px;margin:0 0 14px}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:40px 0;
    border:1px dashed var(--line);border-radius:12px;background:var(--card)}
</style>
</head>
<body>
<div class="wrap">
  <p class="back"><a href="../">&larr; 戻る</a></p>
  <p class="eyebrow">roreki · c1</p>
  <h1>c1</h1>
  <p class="lede">まだ実体はありません。</p>
  <div class="empty">準備中</div>
</div>
</body>
</html>
