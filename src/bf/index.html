<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>路歴（bf） / 訪問地図</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{ --ink:#22261c; --soft:#5f6368; --line:#d9dce0; --accent:#1d63d8; --panel:rgba(255,255,255,.94);
         --visit:#1d63d8; --new:#e0483b; --go:#1d9d5b; --bg:#f5f6f7; }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8eaed; --soft:#9aa0a6; --line:#2a2f34; --panel:rgba(20,23,26,.9); --bg:#0f1214; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
        background:var(--bg); color:var(--ink); padding:12px; max-width:640px; margin:0 auto }
  a{color:var(--accent)}
  .back{font-size:.82rem}
  h1{font-size:1.05rem; margin:6px 0 2px}
  .sub{font-size:.74rem; color:var(--soft); margin:0 0 10px}
  .map-wrap{position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  #map{width:100%; height:60vh; background:#a9c9e8}
  .status{position:absolute; left:10px; top:10px; z-index:500; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:7px 11px; font-size:.8rem; max-width:70%}
  .status .here{font-weight:700}
  .status .tag{font-size:.72rem; padding:1px 7px; border-radius:999px; margin-left:4px}
  .tag.old{background:rgba(29,157,91,.16); color:var(--go)}
  .tag.new{background:rgba(224,72,59,.16); color:var(--new)}
  .score{position:absolute; right:10px; top:10px; z-index:500; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:7px 11px; font-size:.74rem; text-align:right}
  .score b{font-size:1.05rem; font-variant-numeric:tabular-nums}
  .cross{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:450;
    pointer-events:none; color:var(--accent); font-size:20px}
  .controls{display:grid; grid-template-columns:1fr 1fr 1.3fr; gap:8px; margin-top:10px}
  .controls button{border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:10px; padding:12px 6px; font-size:.84rem; font-weight:700; cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .controls button:active{transform:scale(.97)}
  .controls .go{background:var(--go); color:#fff; border-color:var(--go)}
  .controls .go:disabled{opacity:.45}
  .quick{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center}
  .quick button{border:1px solid var(--line); background:var(--panel); color:var(--soft);
    border-radius:999px; padding:5px 11px; font-size:.74rem; cursor:pointer}
  .quick .clear{margin-left:auto; color:var(--soft)}
  .note{font-size:.72rem; color:var(--soft); line-height:1.6; margin-top:10px}
</style>
</head>
<body>
  <p class="back"><a href="../../">← 戻る</a></p>
  <h1>路歴（bf） / 訪問地図</h1>
  <p class="sub">開くと布施駅にいます。新しい場所なら「✓ ここに行った！」で塗る。記録はこの端末に保存されます。</p>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="status" id="status">いまここ: —</div>
    <div class="score">今週 <b id="wk">0</b><br><span style="color:var(--soft)">訪問エリア <b id="cnt" style="font-size:.85rem">0</b></span></div>
    <div class="cross">＋</div>
  </div>

  <div class="controls">
    <button id="btnGps">📍 GPS</button>
    <button id="btnTap">👆 タップ移動</button>
    <button class="go" id="btnGo">✓ ここに行った！</button>
  </div>
  <div class="quick">
    <span style="font-size:.74rem;color:var(--soft)">飛ぶ:</span>
    <button data-lat="34.6672" data-lng="135.5641">布施駅</button>
    <button data-lat="35.681" data-lng="139.767">東京</button>
    <button data-lat="43.068" data-lng="141.351">札幌</button>
    <button data-lat="36.2" data-lng="138.2" data-z="5">日本全体</button>
    <button class="clear" id="btnClear">全消去</button>
  </div>

  <p class="note">
    電車で座って開いて、新しければポチる——それだけの地図です。青い丸＝もう行った所。倍率・現在地・塗り・加点が、ひとつの地図に乗っています。<br>
    ※これは新しい訪問地図の第一版です。粒度（市／丁目）や県ボーナス、月次集計、既存の週次得点との接続は、これから足していく予定の骨組みです。
  </p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  const FUSE={lat:34.6672,lng:135.5641,name:'布施駅'};
  const R=750;                 // 訪問エリアの半径(m)
  const KEY_V='bf_visited', KEY_W='bf_week';

  // ---- 保存データの読み込み（端末に永続化） ----
  let visited=[], week=0;
  try{ visited=JSON.parse(localStorage.getItem(KEY_V)||'[]'); }catch(e){ visited=[]; }
  try{ week=parseInt(localStorage.getItem(KEY_W)||'0',10)||0; }catch(e){ week=0; }
  function save(){ try{ localStorage.setItem(KEY_V,JSON.stringify(visited)); localStorage.setItem(KEY_W,String(week)); }catch(e){} }

  const map=L.map('map',{zoomControl:true}).setView([FUSE.lat,FUSE.lng],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

  const layer=L.layerGroup().addTo(map);
  function drawVisited(){
    layer.clearLayers();
    visited.forEach(v=>L.circle([v.lat,v.lng],{radius:R,color:'#1d63d8',weight:1,
      fillColor:'#1d63d8',fillOpacity:.28}).bindPopup(v.name||'訪問エリア').addTo(layer));
  }
  drawVisited();

  const here=L.circleMarker([FUSE.lat,FUSE.lng],{radius:8,color:'#fff',weight:3,fillColor:'#e0483b',fillOpacity:1}).addTo(map);
  let pos={lat:FUSE.lat,lng:FUSE.lng,name:FUSE.name};

  const statusEl=document.getElementById('status');
  const wkEl=document.getElementById('wk');
  const cntEl=document.getElementById('cnt');
  const goBtn=document.getElementById('btnGo');

  function distM(p,v){
    const dx=(p.lng-v.lng)*Math.cos(p.lat*Math.PI/180)*111000;
    const dy=(p.lat-v.lat)*111000; return Math.hypot(dx,dy);
  }
  function isVisited(p){ return visited.some(v=>distM(p,v)<R); }

  function refresh(){
    cntEl.textContent=visited.length;
    wkEl.textContent=week;
    const done=isVisited(pos);
    statusEl.innerHTML='<span class="here">いまここ: '+(pos.name||'この地点')+'</span>'+
      (done?'<span class="tag old">訪問済</span>':'<span class="tag new">新しい！</span>');
    goBtn.disabled=done;
    goBtn.textContent=done?'✓ もう行った':'✓ ここに行った！';
  }
  function moveTo(lat,lng,name,z){
    pos={lat,lng,name:name||null};
    here.setLatLng([lat,lng]);
    map.setView([lat,lng], z||Math.max(map.getZoom(),14));
    refresh();
  }

  goBtn.onclick=()=>{
    if(isVisited(pos)) return;
    visited.push({name:pos.name||'新しいエリア',lat:pos.lat,lng:pos.lng});
    week+=10; save(); drawVisited(); refresh();
    const c=L.circle([pos.lat,pos.lng],{radius:R,color:'#e0483b',weight:2,fillColor:'#e0483b',fillOpacity:.5}).addTo(map);
    setTimeout(()=>map.removeLayer(c),450);
  };

  document.getElementById('btnGps').onclick=()=>{
    if(!navigator.geolocation){ moveTo(FUSE.lat,FUSE.lng,FUSE.name); return; }
    navigator.geolocation.getCurrentPosition(
      p=>moveTo(p.coords.latitude,p.coords.longitude,'現在地'),
      ()=>moveTo(FUSE.lat,FUSE.lng,FUSE.name+'（GPS不可の初期値）'),
      {enableHighAccuracy:true,timeout:8000});
  };
  let tap=false;
  document.getElementById('btnTap').onclick=()=>{ tap=true; statusEl.querySelector('.here')&&(statusEl.firstChild); };
  map.on('click',e=>{ if(tap){ moveTo(e.latlng.lat,e.latlng.lng,'この地点'); } });

  document.querySelectorAll('.quick button[data-lat]').forEach(b=>{
    b.onclick=()=>moveTo(+b.dataset.lat,+b.dataset.lng,b.textContent,b.dataset.z?+b.dataset.z:null);
  });
  document.getElementById('btnClear').onclick=()=>{
    if(confirm('この端末の訪問記録と得点を全部消しますか？')){ visited=[]; week=0; save(); drawVisited(); refresh(); }
  };

  refresh();
})();
</script>
</body>
</html>
