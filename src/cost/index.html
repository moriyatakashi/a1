<style>
  /* ab-171(2026-10-17): 週ごとの課金の指数の折れ線。トップの一覧には載せない(非常時の別窓)。読むだけ */
  .chart { width: 100%; height: 220px; border-bottom: 1px solid var(--line); }
  .chart polyline { fill: none; stroke: var(--accent); stroke-width: 2; }
  .chart circle { fill: var(--accent); }
  .chart .base { stroke: var(--line); stroke-dasharray: 4 4; }
  .chart text { font-size: 10px; fill: var(--ink-soft); }
  .now { font-size: 1.1rem; margin: 12px 0 4px; font-variant-numeric: tabular-nums; }
  .now b { font-size: 1.6rem; }
  .sub { font-size: 0.85rem; color: var(--ink-soft); }
  .empty { font-size: 0.85rem; color: var(--ink-soft); }
  .note { font-size: 0.72rem; color: var(--ink-soft); margin-top: 18px; }
  table { border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 10px; text-align: right; border-bottom: 1px solid var(--line); }
</style>

<body>
  <p><a href="../../">← 戻る</a></p>
  <h1>路歴 / 課金の指数</h1>
  <p id="lastUpdated" style="font-size:0.8rem;color:#aaa;">最終更新: 2026-10-17 JST</p>

<!-- LOGIN_GATE:START -->
  <div id="login-gate">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="g_id_onload"
      data-callback="handleCredentialResponse"
      data-auto_prompt="false">
    </div>
    <script>document.getElementById('g_id_onload').setAttribute('data-client_id', window.AA_GOOGLE_CLIENT_ID);</script>
    <div class="g_id_signin"></div>
    <p id="status">未ログイン(ログインすると課金の指数が出ます)</p>
  </div>
<!-- LOGIN_GATE:END -->

  <div id="content" style="display:none;">
    <div id="providers"></div>
    <p class="note">2026-08-03 の週(月〜日)の課金を100とした指数です。金額はどこにも置いていません。礼文が毎週月曜 2:55 に Azure のコスト分析を読んで書きます(ab-171)。前の週の1.5倍を超えたら ad-6 に知らせが入ります。Azure は 2026-10-17 にリソースを消したので、0 が続くのが正しい姿です。</p>
  </div>

  <script>window.AA_AUTH_EVENT = "cost-login-success";</script>
  <script src="../common/auth.js?v=202607201000"></script>
  <script type="module" src="app.js?v=202610171200"></script>

    applyLastUpdated("src/cost", "lastUpdated", "最終更新");
