  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .visit-row { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; cursor: pointer; }
  .visit-row.active { border-color: var(--accent); }
  .visit-row-place { font-weight: 600; font-size: 0.88rem; }
  .visit-row-meta { font-size: 0.72rem; color: var(--ink-soft); margin-top: 2px; }
  .popup { display: none; position: absolute; background: #fff; color: #222; border: 1px solid #ccc; border-radius: 8px; padding: 8px 12px; font-size: 0.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.15); pointer-events: none; z-index: 10; max-width: 180px; }
  .popup.show { display: block; }
  .popup-place { font-weight: 700; margin-bottom: 2px; }
  .popup-meta { color: #666; font-size: 0.7rem; }
  .empty { text-align: center; color: var(--ink-soft); padding: 20px 0; }
  .visit-form { display: flex; flex-direction: column; gap: 8px; }
  .visit-form input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; box-sizing: border-box; background: var(--input-bg); color: var(--ink); }
  .visit-row-inputs { display: flex; gap: 8px; }
  .visit-row-inputs input { flex: 1; }
  .btn-gps { padding: 8px 12px; border: 1px solid var(--accent); border-radius: 6px; background: #eef6ff; color: var(--accent); white-space: nowrap; }
  .btn-add-visit { width: 100%; padding: 10px; border: 1px solid var(--accent); border-radius: 8px; background: #fff; color: var(--accent); font-size: 0.95rem; }
  .visit-input-status { font-size: 0.78rem; color: var(--ink-soft); margin-top: 6px; text-align: center; min-height: 1.2em; }
  #hereMapRoot svg { display: block; width: 100%; height: auto; background: transparent; }
  #hereMapRoot .pref { fill: var(--input-bg); stroke: var(--line); stroke-width: 0.5; }
  #hereMapRoot .here { fill: #8fc7ec; }
  #hereZoomRow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--ink-soft); }
  #hereZoomRow input { flex: 1; }
  #hereZoomRow #hereZv { min-width: 34px; text-align: right; }

  <script type="module" src="app.js?v=20260831-local"></script>
  <script>
  (function () {
    const RAD = Math.PI / 180;
    const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * RAD / 2));
    function project(win, box) {
      const [W, S, E, N] = win, [px, py, pw, ph] = box;
      const x0 = W * RAD, y0 = mercY(N);
      const bw = (E - W) * RAD, bh = y0 - mercY(S);
      const s = Math.min(pw / bw, ph / bh);
      const ox = px + (pw - bw * s) / 2, oy = py + (ph - bh * s) / 2;
      return ([lon, lat]) => [ox + (lon * RAD - x0) * s, oy + (y0 - mercY(lat)) * s];
    }
    function toPath(geom, p) {
      const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
      return polys.flat().map(ring =>
        ring.map((pt, i) => (i ? "L" : "M") + p(pt).map(v => v.toFixed(1)).join(" ")).join("") + "Z"
      ).join("");
    }
    function layer(gj, keep, win, box) {
      const p = project(win, box);
      return gj.features
        .filter(f => keep(f.properties.N03_001))
        .map(f => `<path class="pref" data-p="${f.properties.N03_001}" d="${toPath(f.geometry, p)}"/>`)
        .join("");
    }
    function inRing(lon, lat, ring) {
      let c = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
      }
      return c;
    }
    function inFeature(lon, lat, geom) {
      const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
      return polys.some(poly => inRing(lon, lat, poly[0]));
    }
    const svg = document.getElementById("hereMap"), z = document.getElementById("hereZ"), zv = document.getElementById("hereZv");
    let cx = 380, cy = 380;
    const apply = () => {
      const w = 760 / +z.value;
      const x = Math.max(0, Math.min(760 - w, cx - w / 2));
      const y = Math.max(0, Math.min(760 - w, cy - w / 2));
      svg.setAttribute("viewBox", `${x} ${y} ${w} ${w}`);
      zv.textContent = (+z.value).toFixed(1) + "×";
    };
    z.oninput = apply;
    fetch("data/prefectures.geojson").then(r => r.json()).then(gj => {
      svg.innerHTML =
        layer(gj, n => n !== "沖縄県", [129.5, 30, 148.5, 46], [24, 20, 712, 716])
        + layer(gj, n => n === "沖縄県", [127, 26, 128, 27], [42, 64, 156, 120]);
      navigator.geolocation && navigator.geolocation.getCurrentPosition(pos => {
        const { longitude: lon, latitude: lat } = pos.coords;
        const f = gj.features.find(f => inFeature(lon, lat, f.geometry));
        if (!f) return;
        const els = [...svg.querySelectorAll(`[data-p="${f.properties.N03_001}"]`)];
        els.forEach(el => el.classList.add("here"));
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        els.forEach(el => {
          const b = el.getBBox();
          x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
          x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
        });
        cx = (x0 + x1) / 2; cy = (y0 + y1) / 2;
        z.value = 3; apply();
      }, () => {});
    }).catch(() => { svg.innerHTML = '<text x="380" y="380" fill="#aaa" text-anchor="middle" font-size="16">地図の読み込みに失敗しました</text>'; });
  })();
  </script>
