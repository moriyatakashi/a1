<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a1</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="base.css">
  <style>
    /* index.html固有の見た目(カード一覧)のみ。トークン・基本レイアウトはbase.css側。 */
    #cards { display: flex; flex-direction: column; gap: 12px; }
    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      background: var(--card);
      transition: border-color 0.15s ease;
    }
    .card:hover, .card:focus-visible { border-color: var(--accent); }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .card-head { display: flex; align-items: center; gap: 10px; }
    .card-head-tags { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .archive-tag {
      font-size: 0.65rem; padding: 1px 7px; border-radius: 99px;
      border: 1px dashed var(--line); color: var(--sub); white-space: nowrap;
    }
    .card-archived { opacity: 0.6; }
    .card-archived:hover, .card-archived:focus-visible { opacity: 1; }
    .badge {
      width: 30px; height: 30px; flex: none;
      border-radius: 7px;
      background: var(--accent);
      color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 0.95rem;
    }
    .card-title { font-size: 1.05rem; font-weight: 700; }
    .card-desc { color: var(--sub); font-size: 0.82rem; line-height: 1.5; }
    .card-foot {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.72rem;
      color: var(--accent);
      display: flex; align-items: center; gap: 6px;
    }
    .card-foot .arrow { transition: transform 0.15s ease; }
    .card:hover .arrow, .card:focus-visible .arrow { transform: translateX(3px); }

    @media (prefers-reduced-motion: reduce) {
      .card, .card-foot .arrow { transition: none; }
    }

    .toggle-row { margin: 2px 0 0; }
    .toggle-row a { color: var(--sub); text-decoration: none; font-size: 0.78rem; }
    .toggle-row a:hover, .toggle-row a:focus-visible { color: var(--accent); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="back-row">
      <a href="../../">&larr; 戻る</a>
    </div>

    <div>
      <p class="eyebrow">roreki</p>
      <h1>路歴（a1）</h1>
      <p class="lede">路歴は、まだ続く。</p>
    </div>
    <div id="cards"></div>
    <p class="toggle-row"><a href="#" id="toggle-hidden">隠れているカードも表示</a></p>
  </div>
  <script>
    // card.json(b1/run 1.card が読み書きするのと同じファイル)を読んで、そのままカードを組み立てる。
    // 表示ロジックをこの1箇所に一本化しているので、card.jsonの中身が増えても書き換え不要。
    // a1トップへの導線はcard.jsonではなく上のback-row(固定リンク)側で持つ。
    const container = document.getElementById("cards");
    const toggleLink = document.getElementById("toggle-hidden");
    let allCards = [];
    let showHidden = false;

    function renderCards() {
      container.innerHTML = "";
      for (const card of allCards) {
        // show:falseは「ファイル・カード情報は残すが表示はしない」フラグ(旧c1〜c3の
        // archive化に使用)。フィールド自体が無いカードはこれまで通り表示する。
        const hidden = card.show === false;
        if (hidden && !showHidden) continue;

        // card.jsonが手編集等でフィールド欠落(undefined)を含んでいてもクラッシュしないよう、
        // 参照のたびに空文字へフォールバックする(b1/run側の空文字埋めが素通りされる経路への保険)。
        const title = card.title ?? "";
        const url = card.url ?? "";
        const message = card.message ?? "";
        const ba = card.ba ?? "";

        const a = document.createElement("a");
        a.className = hidden ? "card card-archived" : "card";
        a.href = url;

        const head = document.createElement("div");
        head.className = "card-head";

        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = title.charAt(0);

        const titleEl = document.createElement("div");
        titleEl.className = "card-title";
        titleEl.textContent = title;

        head.append(badge, titleEl);

        if (hidden || ba) {
          const tags = document.createElement("div");
          tags.className = "card-head-tags";
          if (hidden) {
            const archiveEl = document.createElement("span");
            archiveEl.className = "archive-tag";
            archiveEl.textContent = "非表示設定";
            tags.append(archiveEl);
          }
          if (ba) {
            const baEl = document.createElement("span");
            baEl.className = "ref-inline";
            baEl.textContent = ba;
            tags.append(baEl);
          }
          head.append(tags);
        }

        const desc = document.createElement("div");
        desc.className = "card-desc";
        desc.textContent = message;

        const foot = document.createElement("div");
        foot.className = "card-foot";
        foot.textContent = url.replace(/^https?:\/\//, "").replace(/\/$/, "") + " ";
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "→";
        foot.append(arrow);

        a.append(head, desc, foot);
        container.append(a);
      }
    }

    toggleLink.addEventListener("click", (e) => {
      e.preventDefault();
      showHidden = !showHidden;
      toggleLink.textContent = showHidden ? "隠す" : "隠れているカードも表示";
      renderCards();
    });

    fetch("data/card.json")
      .then((res) => res.json())
      .then((cards) => {
        allCards = cards;
        renderCards();
      });
  </script>
</body>
</html>
