<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m5 / 現在地マップ(実座標版)</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="../common/base.css?v=1">
<style>
  body { max-width: none; }
  #map-root { max-width: 640px; margin: 0 auto; position: relative; }
  #map path { vector-effect: non-scaling-stroke; }
  #map-root svg { display: block; width: 100%; height: auto; background: transparent; }
  .pref { fill: var(--input-bg); stroke: var(--line); stroke-width: 0.5; }
  .here { fill: #8fc7ec; }
  .lake { fill: #a9d6f2; stroke: #6fa8cf; stroke-width: 0.4; pointer-events: none; }
  @media (prefers-color-scheme: dark) { .lake { fill: #1f4560; stroke: #2f6a90; } }
</style>
</head>
<body>
  <p><a href="../../">← 戻る</a></p>
  <h1>路歴（m5） / 現在地マップ</h1>
  <p style="font-size:0.8rem;color:var(--ink-soft);">実座標のgeojsonをメルカトル投影で描画し、GPSで取得した現在地の都道府県をRay castingで判定・ハイライトする(a2から移設)。外部API・CDNは使わず完全ローカル。2本指(PCはCtrl+ホイール)か＋−で拡大、ドラッグで移動できる。沖縄県は別枠(inset)で描画。</p>
  <div id="map-root"><svg id="map" viewBox="0 0 760 760"></svg></div>
  <script type="module">
    import { panZoom } from "../common/svg-pan-zoom.js";
    // 現在地マップ(a2から移設)。実緯度経度geojsonをメルカトル投影してSVG化し、
    // GPS座標を外部APIなしでRay casting判定して該当県をハイライトする。完全ローカル。
    const RAD = Math.PI / 180;
    const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * RAD / 2));
    function project(win, box) {
      const [W, S, E, N] = win, [px, py, pw, ph] = box;
      const x0 = W * RAD, y0 = mercY(N);
      const bw = (E - W) * RAD, bh = y0 - mercY(S);
      const s = Math.min(pw / bw, ph / bh);
      const ox = px + (pw - bw * s) / 2, oy = py + (ph - bh * s) / 2;
      return ([lon, lat]) => [ox + (lon * RAD - x0) * s, oy + (y0 - mercY(lat)) * s];
    }
    function toPath(geom, p) {
      const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
      return polys.flat().map(ring =>
        ring.map((pt, i) => (i ? "L" : "M") + p(pt).map(v => v.toFixed(1)).join(" ")).join("") + "Z"
      ).join("");
    }
    function layer(gj, keep, win, box) {
      const p = project(win, box);
      return gj.features
        .filter(f => keep(f.properties.N03_001))
        .map(f => `<path class="pref" data-p="${f.properties.N03_001}" d="${toPath(f.geometry, p)}"/>`)
        .join("");
    }
    function inRing(lon, lat, ring) {
      let c = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
      }
      return c;
    }
    function inFeature(lon, lat, geom) {
      const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
      return polys.some(poly => inRing(lon, lat, poly[0]));
    }
    const svg = document.getElementById("map");
    // 2本指で拡大・ドラッグで移動(10/06、ab-126 のついで。m6 と同じ操作)
    const pz = panZoom(svg, { container: document.getElementById("map-root"), width: 760, height: 760 });
    // 湖(いまは琵琶湖だけ、ab-126)。県の上に水色で重ねる。読めなくても地図は出す。
    const lakesP = fetch("lakes.geojson").then(r => r.json()).catch(() => ({ features: [] }));
    fetch("prefectures.geojson").then(r => r.json()).then(async gj => {
      const lakes = await lakesP;
      const lp = project([129.5, 30, 148.5, 46], [24, 20, 712, 716]);
      svg.innerHTML =
        layer(gj, n => n !== "沖縄県", [129.5, 30, 148.5, 46], [24, 20, 712, 716])
        + layer(gj, n => n === "沖縄県", [127, 26, 128, 27], [42, 64, 156, 120])
        + lakes.features.map(f => `<path class="lake" d="${toPath(f.geometry, lp)}"/>`).join("");
      navigator.geolocation && navigator.geolocation.getCurrentPosition(pos => {
        const { longitude: lon, latitude: lat } = pos.coords;
        const f = gj.features.find(f => inFeature(lon, lat, f.geometry));
        if (!f) return;
        const els = [...svg.querySelectorAll(`[data-p="${f.properties.N03_001}"]`)];
        els.forEach(el => el.classList.add("here"));
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        els.forEach(el => {
          const b = el.getBBox();
          x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
          x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
        });
        const w = 760 / 3; // 最初は今いる県を中心に 3 倍で見せる(そこから自由に動かせる)
        pz.setView((x0 + x1) / 2 - w / 2, (y0 + y1) / 2 - w / 2, w);
      }, () => {});
    }).catch(() => { svg.innerHTML = '<text x="380" y="380" fill="#aaa" text-anchor="middle" font-size="16">地図の読み込みに失敗しました</text>'; });
  </script>
</body>
</html>
