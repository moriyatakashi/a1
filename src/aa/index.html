<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="../common/ledger.css?v=202608141900">
<style>
  /* htmlDocs(窓の窓)表示用。各htmlDocsは自己完結(自分のCSS/JS込み)なので、
     iframeで隔離して表示する(aaページ本体のCSSと衝突させないため)。 */
  .detail-block { padding: 10px 14px 14px; border-top: 1px dashed var(--line); margin-top: 4px; }
  .detail-toggle { margin-bottom: 8px; }
  .detail-loading { font-size: 0.78rem; color: var(--ink-soft); }
  .detail-frame { display: block; width: 100%; height: 480px; border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; background: #fff; }
  /* ba番号タグ(新c1へのリンク)。他の.tagと見た目を揃えつつ、リンクだと分かるようhoverで示す */
  a.tag { text-decoration: none; }
  a.tag:hover, a.tag:focus-visible { text-decoration: underline; color: var(--accent); }
  /* ledger.cssの.summary-barはba/bbと共有(4列固定)なので、aaだけ2項目用に上書きする */
  .summary-bar { grid-template-columns: repeat(2, 1fr); }
</style>
</head>
<body>
  <p><a href="../../">← 戻る</a></p>
  <div class="eyebrow">ロレキ内部メモ</div>

  <p id="lastUpdated" style="font-size:0.8rem;color:var(--ink-soft);">最終更新: -</p>

    <div class="stat"><div class="stat-num" id="statCount">—</div><div class="stat-label">有効数</div></div>
  </div>

  <div class="thread-list" id="threadList"></div>

  <script type="module" src="app.js?v=202608141900"></script>
