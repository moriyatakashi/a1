<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../common/config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ba</title>
<link rel="stylesheet" href="../common/ledger.css">
<style>
  #lastUpdated { font-size: .8rem; color: var(--ink-soft); }
  .ba-search { margin: 12px 0; }
  .post-link { font-size: .8rem; }
</style>
</head>
<body>
  <p><a href="../../">← 戻る</a></p>
  <h1>ba</h1>
  <div id="login-gate">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="g_id_onload" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
    <script>document.getElementById('g_id_onload').setAttribute('data-client_id', window.AA_GOOGLE_CLIENT_ID);</script>
    <div class="g_id_signin"></div>
    <p id="status">未ログイン(ログインするとログが表示されます)</p>
  </div>
  <div id="content" style="display:none;">
    <div class="summary-bar">
      <div class="stat"><div class="stat-num" id="statTotal">—</div><div class="stat-label">スレッド</div></div>
      <div class="stat"><div class="stat-num" id="statOpen">—</div><div class="stat-label">オープン</div></div>
      <div class="stat"><div class="stat-num" id="statClosed">—</div><div class="stat-label">クローズ</div></div>
      <div class="stat"><div class="stat-num" id="statLatestBy">—</div><div class="stat-label">直近の記入者</div></div>
    </div>
    <div class="ba-search">
      <button type="button" class="btn-search-reset" id="btnSearchReset" style="display:none;">リセット</button>
    </div>
    <div class="cls-filter" id="clsFilter"></div>
    <div class="list-controls">
      <button type="button" class="btn-toggle-voided" id="btnToggleClosed">closedも表示</button>
      <button type="button" class="btn-toggle-voided" id="btnToggleVoid" style="display:none;">無効スレッドも表示</button>
    </div>
    <div class="thread-list" id="threadList"></div>
  </div>
  <script>window.AA_AUTH_EVENT = "ba-login-success";</script>
  <script src="../common/auth.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    import { applyLastUpdated } from "../common/last-updated.js";
    applyLastUpdated("src/ba", "lastUpdated", "最終更新");
  </script>
</body>
</html>
