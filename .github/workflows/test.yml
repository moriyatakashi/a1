name: Run tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run tests
        # テストファイルは e2e/ 配下に置く運用だが、
        # 特定のパスに固定せずリポジトリ全体から *.test.js を探す
        run: node --test
        # 2026-08-15: api/・api-tests/(Azure Functionsバックエンド)はb3へ移設した(ab-board-apiソース移設)。
        # そちらのテストはb3/.github/workflows/test.ymlのtest-pythonジョブが担う。
