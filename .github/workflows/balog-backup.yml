name: balog-backup (BaLog・Scores・Visits を Google ドライブへ控える)
# 2026-10-07(ab-56): 名前は「ファイル名 (説明)」にそろえる。Actions の一覧が名前順=ファイル名順で並ぶ。旧名: Backup BaLog/Scores/Visits to Google Drive

on:
  # 2026-08-11: aaは今日ファイルを空にした(ba-273)ため、aa側の日次バックアップは
  # もう動かない。二重防止で止めていたa1側のscheduleをここで再有効化する。
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

env:
  STORAGE_ACCOUNT: abfuncstore2026
  RESOURCE_GROUP: rg-ab
  GDRIVE_FOLDER_ID: 1-hfBlg9rQTLqnTQVDVKHheSm-9u0l63u

permissions:
  id-token: write
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install azure-data-tables requests pyyaml

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve table connection string
        run: |
          CONN_STR=$(az storage account show-connection-string \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --query connectionString -o tsv)
          echo "::add-mask::$CONN_STR"
          echo "TABLE_CONNECTION_STRING=$CONN_STR" >> "$GITHUB_ENV"

      - name: Run backup
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          # ab-166: Firestore を aa-lane の fs-get で読むバックアップ専用の読むだけの鍵。無ければ匿名で読む
          AA_BACKUP_KEY: ${{ secrets.AA_BACKUP_KEY }}
        run: python scripts/backup-balog-to-drive.py
