name: entropy-scan (鍵らしい文字列が入っていないか見る)
# 2026-10-07(ab-56): 名前は「ファイル名 (説明)」にそろえる。Actions の一覧が名前順=ファイル名順で並ぶ。旧名: entropy-scan
# 鍵様(高エントロピー)文字列の検出。rbook の `run scan` と同じ本体(scripts/ba_entropy_scan.py)を回す。
# 新規検出があれば exit=1 でジョブが落ちる(=通知)。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 19 * * *'   # 毎日 04:00 JST (19:00 UTC)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 全履歴を取る(--repo が git log --all を使うため)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: repo scan (tree + full history)
        run: python scripts/ba_entropy_scan.py --repo .
      # 2026-10-11(ab-166): ba 盤面のスキャンはやめた(ba は 10/10 に凍結、Azure をやめる)
