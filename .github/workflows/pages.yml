name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "緊急時のみ: テストを飛ばして公開する(既定はテスト成功後にだけ公開)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 2026-09-26(ba-325): テストが落ちたままの状態を公開しない。test.yml と同じ内容をここでも走らせ、
  # 成功したときだけ deploy へ進む(workflow_runで連結せず、1ファイルで完結させる)。
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: node --test

  deploy:
    needs: test
    # testがskipped(skip_tests=true)のときも進めるため、failure/cancelledだけ弾く
    if: ${{ !failure() && !cancelled() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build index.html from nav.yml
        run: npm run build
      - name: Apply cache-busters
        # ba-169: ?v= を参照先ファイルの内容ハッシュで自動生成する(手動更新を廃止)。
        # index生成の後・artifactアップロードの前に、作業ツリーのHTMLを書き換える。
        # 参照欠けがあれば exit=1 でデプロイを止める(タイポ・配置ミスの検知)。
        # 旧 check-cache-busters.mjs(据え置き検知)は手動運用が前提のため本ステップに置き換えた
        # (スクリプト自体は温存)。
        run: node scripts/apply-cache-busters.mjs
      - name: Remove node_modules from deploy artifact
        run: rm -rf node_modules
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
