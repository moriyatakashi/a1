# 日次バックアップ(scripts/backup-balog-to-drive.py)の対象テーブル一覧。
# ここに追記すれば、次回の実行(手動 or 4:00 JSTの定期実行)から自動的に
# バックアップ対象に入る(スクリプト本体の変更は不要)。
# 1テーブル=Google Drive(ba-backupフォルダ)へ1ファイル(<name下>_full_<日時>.json)。

tables:
  - name: BaLog
    note: ba台帳本体(追記オンリー・赤黒帳票)。日次バックアップの発端(2026-07-25実装)。
  - name: Scores
    note: 日々のスコア記録(m1、旧n1)。2026-07-31追加。ab-24(2026-09-29)で正本はFirestoreへ移り、Azure側は書き込み停止(410)。ab-53で消すまでは凍結した旧データとして取り続ける。
  - name: Visits
    note: 訪問記録(n2)。2026-07-31追加。ab-53(2026-10-03)で正本は Firestore の visits へ移り、Azure 側は書き込み停止(410)。消すまでは凍結した旧データとして取り続ける。
  # 2026-10-03 ab-53: Firestore へ移すまでの保険(それまで日次バックアップが無かった)。移した日に
  # firestore_collections へ足し、ここは「凍結」と書く(Scores と同じ扱い)。Sessions はトークンなので取らない。
  - name: PointEvents
    note: 加点イベント(ba-165)。ab-53(2026-10-03)で正本は Firestore の pointEvents へ移り、Azure 側は書き込み停止(410)。凍結した旧データ。
  - name: WeeklyScores
    note: 週次得点の確定スナップショット(ba-53)。ab-53 ③ で移す予定。
  - name: MonthlyScores
    note: 月次得点の確定スナップショット(ba-165③)。ab-53 ③ で移す予定。
  - name: Declarations
    note: 翌週以降の宣言(ba-160)。ab-53 で移す予定。
  - name: StreakChecks
    note: 継続達成のチェック(ba-165)。ab-53 で移す予定。

# Firestore(ab01-9f35a)のコレクション。2026-10-10(ab-166)から、鍵(AA_BACKUP_KEY)があれば aa-lane の fs-get で読む
# (aa-lane の _FS_GET_PATH_RE に入っているものだけ置ける)。鍵が無ければ匿名で読み、読めないものは飛ばす。
# 1コレクション=1ファイル(firestore_<name>_full_<日時>.json)。2026-10-02 ab-51 で追加
# (Scores の正本が Firestore に移ったのに、日次バックアップは Azure の凍結分しか取っていなかったため)。
firestore_project: ab01-9f35a
firestore_collections:
  - name: scores
    note: 毎日スコアの正本(ab-24 以降、m1 が直接書く)。
  - name: scoringRules
    note: ba の難易度別配点の版(ab-53、2026-10-03 Azure ScoringRules から移した。足すだけで直さない・消さない)。
  - name: visits
    note: 訪問の正本(ab-53 以降、m2・x5 が直接書く)。
  - name: pointEvents
    note: 加点イベントの正本(ab-53 以降、訪問の初訪問加点を m2・x5 が同じ batch で書く)。
  # 2026-10-03 ab-111: 台帳も Firestore にしか無く、丸ごと取り出す仕組みが無かった(切り替えをスムーズに、の第一歩)。
  # note は各スレッドの下の notes にあるので subcollections で一緒に取る。adThreads は読みが鍵必須(Rules で拒否)で、
  # 中身をよそに置かない約束(ad)なので取らない。
  - name: abThreads
    note: ab(依頼・連絡)の台帳。書き込みは aa-lane 経由。
    subcollections: [notes]
  - name: acThreads
    note: ac(決定事項)の台帳。書き込みは aa-lane 経由。
    subcollections: [notes]
  # 2026-10-10 ab-166: af(ほぼba、Takashi のメモ)と wishes(行きたい場所)も取る。読みは本人だけなので鍵で読む。
  - name: afThreads
    note: af(ほぼba、Takashi のメモ置き場)。m3 と aa-lane から書く。
    subcollections: [notes]
  - name: wishes
    note: 行きたい場所(m6)。
