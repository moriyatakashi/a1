<meta charset="utf-8">
<style>
  body { margin: 0 }
  #wrap { max-width: 760px; margin: 0 auto }
  #map { display: block; width: 100%; background: #fff }
  .here { fill: #8fc7ec }
  #z { width: 100%; box-sizing: border-box; margin: 8px 0 }
</style>
<script>
const RAD = Math.PI / 180;
const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * RAD / 2));
function project(win, box) {
  const [W, S, E, N] = win, [px, py, pw, ph] = box;
  const x0 = W * RAD, y0 = mercY(N);
  const bw = (E - W) * RAD, bh = y0 - mercY(S);
  const s = Math.min(pw / bw, ph / bh);
  const ox = px + (pw - bw * s) / 2, oy = py + (ph - bh * s) / 2;
  return ([lon, lat]) => [ox + (lon * RAD - x0) * s, oy + (y0 - mercY(lat)) * s];
}
function toPath(geom, p) {
  const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
  return polys.flat().map(ring =>
    ring.map((pt, i) => (i ? "L" : "M") + p(pt).map(v => v.toFixed(1)).join(" ")).join("") + "Z"
  ).join("");
}
function layer(gj, keep, win, box) {
  const p = project(win, box);
  return gj.features
    .filter(f => keep(f.properties.N03_001))
    .map(f => `<path class="pref" data-p="${f.properties.N03_001}" d="${toPath(f.geometry, p)}"/>`)
    .join("");
}
// 点(経度,緯度)がリング内か: Ray casting
function inRing(lon, lat, ring) {
  let c = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function inFeature(lon, lat, geom) {
  const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;
  return polys.some(poly => inRing(lon, lat, poly[0]));
}
fetch("a1.geojson").then(r => r.json()).then(gj => {
  document.body.innerHTML = `<div id="wrap"><svg id="map" viewBox="0 0 760 760">`
    + layer(gj, n => n !== "沖縄県", [129.5, 30, 148.5, 46], [24, 20, 712, 716])
    + layer(gj, n => n === "沖縄県", [127, 26, 128, 27], [42, 64, 156, 120])
    + `</svg><input type="range" id="z" min="1" max="8" step="0.1" value="1"></div>`;

  const svg = document.getElementById("map"), z = document.getElementById("z");
  let cx = 380, cy = 380; // ズームの中心。位置不明なら地図中央

  // viewBox を書き換えてズーム。中心は水色県、地図範囲(0..760)からはみ出さないようクランプ
  const apply = () => {
    const w = 760 / +z.value;
    const x = Math.max(0, Math.min(760 - w, cx - w / 2));
    const y = Math.max(0, Math.min(760 - w, cy - w / 2));
    svg.setAttribute("viewBox", `${x} ${y} ${w} ${w}`);
  };
  z.oninput = apply;

  navigator.geolocation && navigator.geolocation.getCurrentPosition(pos => {
    const { longitude: lon, latitude: lat } = pos.coords;
    const f = gj.features.find(f => inFeature(lon, lat, f.geometry));
    if (!f) return;
    const els = [...document.querySelectorAll(`[data-p="${f.properties.N03_001}"]`)];
    els.forEach(el => el.classList.add("here"));
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    els.forEach(el => {
      const b = el.getBBox();
      x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
      x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
    });
    cx = (x0 + x1) / 2; cy = (y0 + y1) / 2;
    apply();
  }, () => {});
});
</script>
